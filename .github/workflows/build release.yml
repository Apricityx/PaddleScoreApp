name: Flutter Windows, Linux, macOS, and Android Release

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-windows:
    # Flutter 3.29 只支持到 VS 2022（主版本 17）；windows-latest 与 windows-2025
    # 现在都指向 VS 2026(18) 镜像，会退化成 -G "Visual Studio 16 2019" 而失败。
    # 待升级 Flutter（>= 3.41 才认识 VS 2026）后可去掉此固定。
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      # - name: Add Windows Platform Support
        # run: flutter create --platforms=windows .

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Copy SQLite3.dll
        run: copy lib\assets\SQLite3.dll build\windows\x64\runner\Release\SQLite3.dll
        shell: cmd

      - name: Upload Windows Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: build/windows/x64/runner/Release/

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'

      - name: Install dependencies for Linux build
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Enable Linux Desktop Support
        run: flutter config --enable-linux-desktop

      # - name: Add Linux Platform Support
        # run: flutter create --platforms=linux .

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Linux Release
        run: flutter build linux --release

      - name: Upload Linux Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: build/linux/x64/release/bundle/

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'

      - name: Enable macOS Desktop Support
        run: flutter config --enable-macos-desktop

      # - name: Add macOS Platform Support
        # run: flutter create --platforms=macos .

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Upload macOS Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: build/macos/Build/Products/Release/

  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
